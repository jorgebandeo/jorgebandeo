<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620">
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop offset="0%" stop-color="#090B10"/><stop offset="100%" stop-color="#111722"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .pulse{animation:pulse 1.7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.ring{animation:ring 1.7s ease-out infinite;transform-box:fill-box;transform-origin:center}.b1{animation:bar 5s ease-in-out infinite}.b2{animation:bar 6s ease-in-out .8s infinite}.b3{animation:bar 7s ease-in-out 1.2s infinite}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.72}}@keyframes ring{0%{transform:scale(.7);opacity:.45}100%{transform:scale(2);opacity:0}}@keyframes bar{0%,100%{opacity:.82}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="720" height="620" rx="28" fill="url(#bg)"/>
  <rect x="22" y="22" width="84" height="576" rx="28" fill="#6E1631"/>
  <rect class="b1" x="128" y="22" width="242" height="46" rx="23" fill="#FF9A62"/><rect class="b2" x="386" y="22" width="104" height="46" rx="23" fill="#C49AE8"/><rect class="b3" x="506" y="22" width="192" height="46" rx="23" fill="#6FA8DC"/>
  <rect x="128" y="88" width="570" height="510" rx="24" fill="#0F141D" stroke="#222B38"/>
  <text x="164" y="166" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="700">JORGE BANDEO</text>
  <rect x="164" y="193" width="174" height="44" rx="22" fill="#0C1711" stroke="#7EE787" stroke-opacity=".55"/>
  <circle class="ring" cx="190" cy="215" r="9" fill="#7EE787" opacity=".42"/><circle class="pulse" cx="190" cy="215" r="6" fill="#7EE787" filter="url(#glow)"/>
  <text x="210" y="223" fill="#7EE787" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700">ONLINE</text>
  <text x="164" y="302" fill="#AAB5C3" font-family="Arial,Helvetica,sans-serif" font-size="22">COMPUTER ENGINEER</text>
  <text x="164" y="338" fill="#AAB5C3" font-family="Arial,Helvetica,sans-serif" font-size="22">SYSTEMS DEVELOPER</text>
  <text x="164" y="414" fill="#FFB17B" font-family="Arial,Helvetica,sans-serif" font-size="19">SOFTWARE · ARCHITECTURE</text>
  <text x="164" y="447" fill="#FFB17B" font-family="Arial,Helvetica,sans-serif" font-size="19">AUTOMATION · AI · HARDWARE</text>
  <line x1="164" y1="493" x2="654" y2="493" stroke="#243142"/>
  <text x="164" y="539" fill="#7F8A99" font-family="Arial,Helvetica,sans-serif" font-size="16">UNIVALI · 2024 · SC / BRAZIL</text>
